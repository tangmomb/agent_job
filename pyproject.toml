[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-job"
version = "0.1.0"
description = "Assistant de recherche d'emploi à base d'agents LLM : tri des offres, lettres de motivation et suivi des candidatures (LinkedIn, Indeed, Welcome to the Jungle)"
requires-python = ">=3.11"
dependencies = [
    "mistralai>=1.0",
    "playwright>=1.48",
    "gspread>=6.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "psutil>=5.9",
]

[project.scripts]
agent-job = "agent_job.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
